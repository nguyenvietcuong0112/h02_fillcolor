name: easy_ads_flutter
description: Easy Ads is a wrapper around famous ad packages which let you integrate ads easily
version: 1.0.6
homepage: https://github.com/nooralibutt/easy-ads
repository: https://github.com/nooralibutt/easy-ads

environment:
  sdk: ">=2.17.5 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.0.0
  app_tracking_transparency: ^2.0.4
  gma_mediation_applovin: ^2.6.2
  gma_mediation_ironsource: ^2.4.3
  gma_mediation_meta: ^1.5.3
  gma_mediation_mintegral: ^2.1.1
  gma_mediation_pangle: ^4.0.0
  gma_mediation_unity: ^1.9.0
  collection: ^1.16.0
  logger: ^1.1.0
  shimmer: ^2.0.0
  flutter_spinkit: ^5.2.0
  adjust_sdk: ^5.6.2
  firebase_core: ^3.4.0
  firebase_analytics: ^11.3.0
  firebase_remote_config: ^5.0.1
  in_app_purchase: ^3.2.3
  in_app_purchase_storekit: ^0.4.4
  shared_preferences: ^2.2.2
  http: ^1.2.2
  package_info_plus: ^8.1.2
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  assets:
    - assets/json/